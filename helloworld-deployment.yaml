apiVersion: apps/v1
kind: Deployment
metadata:
  name: helloworld
spec:
  replicas: 2

  selector:
    matchLabels:
      app: helloworld

  template:
    metadata:
      labels:
        app: helloworld

    spec:
      containers:
        - name: helloworld
          image: helloworld:latest

          imagePullPolicy: Never

          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: helloworld-service

spec:
  type: NodePort

  selector:
    app: helloworld

  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080