
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hello World</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 650px;
            padding: 50px;
            text-align: center;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;

            backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);

            font-size: 38px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 15px;
            letter-spacing: -1px;
        }

        .message {
            font-size: 20px;
            color: #cbd5e1;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            padding: 13px 28px;

            color: white;
            background: #6366f1;

            text-decoration: none;
            border-radius: 12px;

            font-size: 16px;
            font-weight: bold;

            transition: 0.3s;
        }

        .button:hover {
            background: #8b5cf6;
            transform: translateY(-2px);
        }

        .status {
            margin-top: 30px;
            font-size: 14px;
            color: #94a3b8;
        }

        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            margin-right: 6px;

            background: #22c55e;
            border-radius: 50%;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">
            👋
        </div>

        <h1>Hello World!</h1>

        <p class="message" th:text="${message}">
            Welcome to my Spring Boot application.
        </p>

        <a href="/product" class="button">
            Get Started →
        </a>

        <div class="status">
            <span class="dot"></span>
            Spring Boot Application Running
        </div>

    </div>

</body>

</html>
